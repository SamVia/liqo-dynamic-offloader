apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        args:
        - "--target-cluster-ids={{ .Values.config.targetClusterIDs }}"
        - "--excluded-namespaces={{ .Values.config.excludedNamespaces }}"
        - "--trap-whitelist-labels={{ .Values.config.trapWhitelistLabels }}"
        - "--trap-blacklist-labels={{ .Values.config.trapBlacklistLabels }}"
        - "--cleanup-whitelist-labels={{ .Values.config.cleanupWhitelistLabels }}"
        - "--cleanup-blacklist-labels={{ .Values.config.cleanupBlacklistLabels }}"
        - "--trap-backoff={{ .Values.config.trapBackoff }}"
        - "--cleanup-delay={{ .Values.config.cleanupDelay }}"
        - "--enable-trap={{ .Values.config.enableTrap }}"
        - "--enable-cleanup={{ .Values.config.enableCleanup }}"
        {{- if .Values.config.dryRun }}
        - "--dry-run"
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}