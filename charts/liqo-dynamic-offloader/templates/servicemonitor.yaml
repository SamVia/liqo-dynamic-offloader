{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: '{{ include "liqo-dynamic-offloader.fullname" . }}'
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "liqo-dynamic-offloader.labels" . | nindent 4 }}
spec:
  endpoints:
    - port: "https"
      scheme: "https"
      bearerTokenFile: "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tlsConfig:
        insecureSkipVerify: true
  selector:
    matchLabels:
      {{- include "liqo-dynamic-offloader.selectorLabels" . | nindent 6 }}
{{- end }}