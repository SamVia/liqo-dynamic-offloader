name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-and-test:
    name: Build and Test Operator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the Go version from go.mod so the CI always matches the project.
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run Envtests
        run: go test -v ./...

      - name: Build binary
        run: go build -o bin/manager main.go

  go-lint:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the Go version from go.mod so the CI always matches the project.
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # latest picks the newest stable release automatically.
          # Pin to a specific version (e.g. v1.59.1) if you ever need stricter
          # reproducibility or need to work around a regression.
          version: latest

  helm-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/liqo-dynamic-offloader

      - name: Render chart
        run: helm template liqo-dynamic-offloader charts/liqo-dynamic-offloader --namespace liqo-system

  shell-check:
    name: Validate Demo Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

  e2e:
    name: E2E Tests (kind + Liqo)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KIND_VERSION: v0.31.0
      LIQOCTL_VERSION: v1.2.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kind and liqoctl
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install kind /usr/local/bin/
          curl -fsSLo liqoctl "https://github.com/liqotech/liqo/releases/download/${LIQOCTL_VERSION}/liqoctl-linux-amd64"
          sudo install liqoctl /usr/local/bin/

      # The suite creates the clusters, peers them with Liqo and deploys the
      # operator built from this commit. Clusters are kept so the next step
      # can inspect them; the runner is discarded at the end of the job.
      - name: Run E2E tests
        run: make e2e E2E_KEEP_CLUSTERS=true

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl --context kind-e2e-local get nodes -o wide || true
          kubectl --context kind-e2e-local get pods -A -o wide || true
          kubectl --context kind-e2e-local get namespaceoffloadings -A || true
          kubectl --context kind-e2e-local logs -n dynamic-offloader-system deployment/liqo-dynamic-offloader --tail=200 || true

  docker-build:
    name: Validate Container Build
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  publish-image:
    name: Build and Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}