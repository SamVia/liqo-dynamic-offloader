version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      check-blank: false
      exclude-functions:
        - "fmt:.*"
        - "io:Close"
    misspell:
      locale: US
  exclusions:
    rules:
      - path: '_test[.]go'
        linters:
          - unparam
          - unused

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
